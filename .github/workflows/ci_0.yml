
name: CI/CD - Segurança Python e AWS S3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    name: Análise de Segurança e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar testes unitários
        run: |
          pytest tests/ -v

      - name: Análise de segurança Bandit
        run: |
          bandit -ll -r codigo/

  deploy:
    name: Criar S3 e enviar código
    needs: security
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Criar bucket S3
        env:
          BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
        run: |
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Bucket já existe"
          else
            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region us-east-1
          fi

      - name: Upload do arquivo Python
        env:
          BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
        run: |
          aws s3 cp codigo/main2.py \
            s3://$BUCKET_NAME/codigo/main2.py

          echo "Upload concluído!"
