name: Pipeline Paralelo e Sequencial com Python

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Permite rodar manualmente pela interface do GitHub

jobs:
  # 1. JOB INICIAL (Sequencial - Ponto de partida)
  preparacao:
    name: Validar Ambiente e Dependências
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar estrutura de arquivos
        run: |
          echo "Iniciando validação do repositório..."
          ls -la

  # 2. JOBS PARALELOS (Ambos dependem apenas de 'preparacao', então rodam juntos)
  analise-estatica:
    name: Lint e Qualidade de Código
    needs: preparacao
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar linter e verificar código
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  testes-unitarios:
    name: Executar Testes
    needs: preparacao
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Faz cache das dependências para acelerar execuções futuras

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Rodar Pytest
        run: |
          pip install pytest
          pytest

  # 3. JOB FINAL (Sequencial - Aguarda os dois jobs paralelos terminarem com sucesso)
  execucao-final-python:
    name: Executar Script Principal Python
    needs: [analise-estatica, testes-unitarios]
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Baixar código do repositório
        uses: actions/checkout@v4

      - name: Step 2 - Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Step 3 - Instalar bibliotecas do projeto
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Step 4 - Executar o script Python final
        env:
          AMBIENTE: producao
          # Exemplo de uso de secrets cadastrados no repositório:
          # API_KEY: ${{ secrets.MINHA_API_KEY }}
        run: |
          python main.py
